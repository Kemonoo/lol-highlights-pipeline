name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the production target; Linux catches path and font assumptions.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check pipeline tests

      # The suite covers pure decision logic and config resolution only: no network,
      # no GPU, no ffmpeg, no API keys. If a test here needs any of those, it is
      # testing the wrong thing.
      - name: Test
        run: pytest -q

  doctor:
    name: doctor runs on a bare machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # A fresh clone with no .env, no ffmpeg and no Ollama must still produce a
      # readable diagnosis rather than a traceback — that report is a new user's
      # first interaction with the project.
      - name: Run doctor (expected to report problems, not crash)
        run: |
          set +e
          python -m pipeline.doctor
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "::error::doctor crashed (exit $code) instead of reporting failures"
            exit 1
          fi
          echo "doctor exited $code (0=ready, 1=blocking problems found) - OK"
