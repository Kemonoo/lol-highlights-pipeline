# Pipeline configuration. ${VARS} are expanded from environment / .env.
#
# Run `python -m pipeline.doctor` to check this config against what is actually
# installed and reachable on your machine before a full run.

llm:
  # ── Which model does which job ─────────────────────────────────────────────
  # Every role below takes the same shape:
  #   provider:  gemini | ollama | openai | anthropic | none
  #   model:     provider-specific model id ("auto" = best installed, ollama only)
  #   api_key:   ${ENV_VAR} — omit for local providers
  #   base_url:  override the endpoint. This is what makes any OpenAI-compatible
  #              backend work: OpenRouter, Groq, Together, DeepSeek, LM Studio,
  #              vLLM, llama.cpp, or Ollama's own /v1 endpoint. With
  #              provider: openai + base_url, you can run every text role on
  #              hardware or an account of your choosing.
  #   thinking:  off | low | high — reasoning budget (Gemini 3.x). Ignored by
  #              providers that don't expose one.
  #
  # Model IDs verified against the live Gemini API on 2026-07-28. Google retires
  # models on a schedule (gemini-2.0-flash started 404ing mid-2026; the whole 2.5
  # family shuts down Oct 2026). If a stage suddenly fails with HTTP 404, check
  # https://ai.google.dev/gemini-api/docs/deprecations and change the id here —
  # that is the only place model ids live.
  # `gemini-flash-latest` / `gemini-flash-lite-latest` are floating aliases that
  # never 404 but can change behaviour without warning. Pinned ids are the default
  # here on purpose; switch to an alias if you'd rather have uptime than stability.
  defaults:
    timeout_s: 120
    max_retries: 4
    retry_base_s: 20          # backoff between retries = retry_base_s * attempt
    autostart: true           # if a LOCAL Ollama isn't answering, run `ollama serve`
                              # and wait for it. Ollama installs no service and no
                              # startup entry, so an unattended 03:00 run otherwise
                              # dies at the preflight whenever nobody left the tray
                              # app open. Ignored for a remote base_url.

  roles:
    judge:                    # stage 4 — watches each surviving clip as VIDEO
      provider: gemini        # needs NATIVE video understanding; local VLMs and
                              # OpenAI chat models cannot do this. With no key the
                              # stage degrades to local_judge() instead of failing.
      model: gemini-3.6-flash
      api_key: ${GEMINI_API_KEY}
      thinking: low           # measured: 409 -> 92 tokens and 4.2s -> 2.3s per call
                              # versus default thinking, with identical scores.
      # Gemini's free tier meters requests PerProjectPerModel, so each id below carries
      # its OWN daily allowance on the SAME key. When one runs out the stage moves to the
      # next and re-sends the clip, which is why a 20/day limit is not a 20/day limit.
      # Verified 2026-09-02: with gemini-3.6-flash 429ing on quota, all three of these
      # still answered video on the same key. Keep them genuinely different models —
      # an alias that resolves to the primary is not a separate allowance.
      overflow_models:
        - gemini-3.1-flash-lite
        - gemini-flash-latest
        - gemini-flash-lite-latest

    vlm:                      # stage 3 — per-frame gameplay/kill detection
      provider: ollama        # free + local. The cost cascade depends on this
                              # staying cheap: it sees ~10x more clips than judge.
      model: auto             # auto = best vision model installed (see providers/ollama.py)
      base_url: http://localhost:11434

    commentary:               # stage 6 — voiceover lines (produced mode only)
      provider: auto          # auto = gemini if GEMINI_API_KEY is set, else ollama
      model: gemini-3.1-flash-lite
      api_key: ${GEMINI_API_KEY}
      fallback:               # used when provider: auto finds no API key
        provider: ollama
        model: qwen2.5:7b     # MUST be installed (`ollama list`)
        base_url: http://localhost:11434

    feedback:                 # stage 0 — classifies viewer comment sentiment
      provider: auto
      model: gemini-3.1-flash-lite
      api_key: ${GEMINI_API_KEY}
      fallback:
        provider: ollama
        model: qwen2.5:7b
        base_url: http://localhost:11434

    thumbnail_image:          # stage 10 — reaction-face image generation
      provider: gemini        # image generation; needs BILLING enabled (not free tier).
      model: gemini-3.1-flash-image
      api_key: ${GEMINI_API_KEY}

twitch:
  game_id: "21779"            # League of Legends
  mode: top_clips             # top_clips | broadcasters
  broadcasters: []            # twitch logins (challenger list) — used when mode: broadcasters
  fetch_count: 220            # clips to consider per day (start point)
  expand_step: 150            # extra clips fetched per round when the video is short
  max_fetch: 220              # = fetch_count -> expansion disabled (no stretching by
                              # digging deeper; ~20 clips from the normal pool is plenty)
  expand_keep_step: 25        # prefilter keep-cap raise per expansion round
  window_hours: 24
  timezone: Europe/Amsterdam

prefilter:                    # thresholds from twitch_clips training
  enabled: true
  audio_exclude: 0.22
  audio_pass: 0.52
  motion_exclude: 0.015
  max_keep: 52                # best N clips proceed to VLM stage. Raised from 40 because
                              # vlm_filter only passes ~65% of these, which on thin days
                              # left 22-23 survivors — fewer than vlm_filter.max_keep, so
                              # raising THAT alone changed nothing on 4 of 11 replayed
                              # days. 52 x 0.65 ~= 34 survivors, enough to fill the judge
                              # every day. COST: vlm_filter runs at ~2.0 min/clip locally
                              # and is already the bulk of the run (79 of 110 min), so
                              # this adds ~24 min, finishing ~05:15 instead of ~04:50.
                              # Drop it back to 40 if that matters more than length.
  # Keep English + the languages faster-whisper translates well (non-English speech is
  # transcribed → English and captioned). ja/zh stay out (JP talk-context, ZH low-signal).
  include_languages: [en, fr, de, es, ru, pt, it, pl, cs, sk, ko]
  exclude_languages: [ja, zh] # used only when include_languages is empty

vlm_filter:                   # model choice lives in llm.roles.vlm
  enabled: true
  max_keep: 24                # clips passed to the API judge. THIS is what sets video
                              # length, not the judge: vlm_filter keeps 22-30 clips on a
                              # normal day and this cap threw the rest away before the
                              # judge ever saw them (87 viable candidates discarded over
                              # 11 days). At a ~67% judge keep-rate and ~32s per kept
                              # clip, 18 yields ~6.5 min against an 8-10 min target; 24
                              # yields ~8.6. Free to raise: all 40 prefiltered clips are
                              # VLM-scored and downloaded anyway, so this only slices the
                              # result — the extra cost is judge REQUESTS, which stopped
                              # being scarce once the role gained overflow_models.
                              # Quality is unaffected: the judge still applies the same
                              # bar, it just gets more to choose from.
  # ── stepwise judgment (see vlm_filter.py docstring) ──
  gameplay_frames: 3          # frames for the binary gameplay majority vote
  killfeed_every_s: 5         # seconds between kill-feed crop checks
  kill_audio_min: 0.30        # kills >= 1 AND audio >= this -> KEEP
  hype_only_min: 0.55         # no kills but audio >= this -> KEEP (funny/hype clips)
  save_crops: true            # save kill-feed/banner crops for region calibration
  japanese_needs_kills: true  # JP-title clips can't pass on audio hype alone
  regions:                    # frame fractions [x1, y1, x2, y2] — measured from a real
    killfeed: [0.82, 0.08, 1.0, 0.45]   # 1080p screenshot; CALIBRATE via crops/
    banner: [0.35, 0.05, 0.65, 0.22]    # center multikill announcement
    eventlog: [0.0, 0.75, 0.30, 1.0]    # bottom-left "has slain ..." text

api_judge:                    # full-video quality judge — model in llm.roles.judge
  enabled: true               # falls back to local_judge() when no API key is set
  # Google raised the inline-upload cap from 20MB to 100MB in Jan 2026, so the
  # judge no longer has to watch a 480p smear. Clips over max_mb even at this
  # height go through the Files API (2GB cap) instead of being downscaled further.
  max_mb: 90                  # inline payload budget (base64-encoded)
  shrink_height: 720          # was 480 — only mattered under the old 20MB cap
  shrink_crf: 28              # was 30; more headroom now that the size cap is 4.5x
  daily_budget: 20            # max judge REQUESTS per quota-day, PER MODEL (0 = unlimited).
                              # Set to the real free-tier ceiling so the chain rotates
                              # exactly at the boundary instead of discovering it with a
                              # wasted 429. This is PER MODEL, so the invariant that keeps
                              # the budget from silently capping video length is
                              # daily_budget x len(judge chain) >= vlm_filter.max_keep —
                              # here 20 x 4 = 80 against 24 needed. The
                              # Gemini free tier is a hard 20/day/model
                              # (GenerateRequestsPerDayPerProjectPerModel-FreeTier) and a
                              # run judges 14-18 clips, so without this the wall is hit
                              # mid-list at an unpredictable point. Clips are judged
                              # best-first, so the budget always buys the top of the list.
                              # Counted per Pacific day (when Google resets), not local —
                              # a 03:00 Amsterdam run is still in the previous Pacific day.
                              # Failed requests count, because the provider counts them.
                              # Raise only if your plan actually allows more; on the free
                              # tier, lower vlm_filter.max_keep instead.
  min_entertainment: 6        # keep gameplay clips at or above this
  min_entertainment_reaction: 7  # reaction-focus clips need a higher bar
  min_play_quality: 7         # or any clip with play this impressive
  filler_min_entertainment: 4 # when the video is short, fill with decent (ent>=4) clips
  # when Gemini is unavailable (quota), clips are judged from local signals instead of
  # fail-open kept. A no-kill clip is only rescued if it's loud AND high-motion (chaos,
  # not singing/walking). Raise these to be stricter on quota-dead days.
  fallback_audio_min: 0.72
  fallback_motion_min: 0.11

transcribe:                   # streamer speech -> English captions (faster-whisper)
  enabled: true               # transcribe+translate every clip so the long-form can caption
                              # it. Burned captions carry a no-narration montage: viewers
                              # watch muted, and the reaction is half the joke.
  model: small                # tiny|base|small|medium — small fits the RTX 3050 4GB well
  max_seconds: 60             # ignore speech past this point in a clip (cost bound)
  skip_languages: []          # Twitch clip languages to skip entirely. NB this is the
                              # CHANNEL's declared language, not detected speech, and it is
                              # often wrong — an [en] entry silently drops captions from
                              # bilingual streamers. [] = caption everything (recommended).
  device: auto                # auto | cpu | cuda. `auto` uses CUDA when a working GPU stack is
                              # detected and silently falls back to CPU otherwise, so this is
                              # safe on any machine. Historical note: an unattended GPU run
                              # crashed in cuDNN ("cudnnGetLibConfig", err 127) — that is a
                              # missing cuDNN 9, fixed with `pip install nvidia-cudnn-cu12`.
                              # `python -m pipeline.doctor` checks for it.
  compute_type: auto          # auto | int8 (cpu) | int8_float16 (cuda)
  cpu_fallback_after_crash: true  # The cuDNN/ctranslate2 probe behind `auto` is a
                              # load-time check; the GPU can still die mid-inference,
                              # and it does (7 of 32 August runs, killed with no Python
                              # exception — nothing in-process can catch that). When on,
                              # the stage drops a breadcrumb before touching the GPU and
                              # clears it on success, so if a run finds one it knows the
                              # last attempt was killed there and uses cpu/int8 instead.
                              # Costs a slower stage on the retry; buys a finished video.

feedback:                     # stage 0: read comments on recent uploads each run
  enabled: true
  videos_to_check: 5          # how many recent uploads to scan
  min_agreement: 2            # comments that must agree before a signal is ACTIONABLE

auto_update:                  # optional: Claude Code applies config-level proposals
  enabled: false              # needs `claude` CLI installed + authenticated
  command: claude

blacklist:
  # Seeded from your 2026-06-09 labels: JP event/custom-tournament channels whose clips
  # you marked bad/pro-play. Edit freely — remove any you want back in.
  broadcasters:
    - kokujintv
    - k4sen
    - らいじん
    - revol87
    - デイワン

match_linker:
  enabled: false              # Phase 2
  provider: riot              # riot | opgg | ugg
  riot_api_key: ${RIOT_API_KEY}
  riot_region: euw1
  # broadcaster twitch login -> list of summoner "Name#TAG"
  summoner_map: {}

commentary:                   # model choice lives in llm.roles.commentary
  enabled: false              # LEAN MODE: no AI voiceover script (Synapse-style: clips speak
                              # for themselves). Set true to bring back narrated commentary.
  style: hype_caster          # hype_caster | analyst | chill  (base style; rotated when vary_style: true)
  vary_style: true            # cycle hype_caster/chill/analyst across clips to avoid monotony
  max_sentences: 2

tts:
  enabled: false              # LEAN MODE: no voiceover. true = narrated (needs commentary.enabled)
  provider: kokoro            # edge-tts (Microsoft Neural, needs internet) | kokoro (local, best free quality)
  voice: af_bella             # friendly key (male-us -> am_michael) OR a raw Kokoro id.
                              # best Kokoro voices: am_michael / am_fenrir / am_puck (male),
                              # af_heart / af_bella (female). Avoid am_adam (graded F+).
  speed: 1.0                  # kokoro playback speed; <1.0 = slower/calmer, >1.0 = punchier

video:
  width: 1920
  height: 1080
  fps: 30
  preset: veryfast            # x264 encode speed/quality tradeoff (software encoding only)
  encoder: auto               # auto | libx264 | h264_nvenc | h264_qsv | h264_videotoolbox
                              # `auto` probes `ffmpeg -encoders` and picks hardware encoding
                              # when your machine has it (NVIDIA / Intel / Apple Silicon),
                              # falling back to libx264. Assembly is the slowest stage on a
                              # CPU-only box, so this is the single biggest win from better
                              # hardware. Pin a value if autodetect picks badly.
  font: null                  # null = auto (Arial Bold on Windows, CJK fallback for JP/KR/CN names)
  intro_enabled: true
  intro_title: DAILY LEAGUE HIGHLIGHTS   # used only when brand.enabled is false
  brand:                        # ── YOUR channel identity — change these ──────────
    enabled: true               # animated logo sting as the intro (replaces the text card)
    name: DAILY HIGHLIGHTS      # wordmark rendered in gold. Set this to your channel name.
    tagline: LEAGUE OF LEGENDS  # smaller line under the wordmark
    splash_champion: LeeSin     # Data Dragon champion id used as the intro backdrop.
                                # Any champion works: Jinx, Yasuo, Ahri, KaiSa, MissFortune...
                                # (ids are case-sensitive and have no spaces)
    splash_skin: 0              # 0 = base skin. LeeSin_11 = God Fist, for example.
    splash_path: ""             # optional: path to your OWN artwork — overrides the download
                                # entirely, which is the right move for a real channel.
    intro_seconds: 2.8
    # See config.kemono.yaml for the fully-branded example this repo actually runs.
  lower_third_seconds: 5.5    # how long the streamer card stays on screen
  countdown_enabled: true     # clips play worst->best with a #N badge (retention format)
  caption_y_frac: 0.70        # vertical position of the burned English captions, as a
                              # fraction of frame height (0.70 = 70% down). The LoL HUD
                              # owns the bottom ~13% and streamer overlays sit just above
                              # it, so lower values are safer than they look. Raise
                              # toward 0.78 only if your clips have a clean lower third.
  replay_enabled: false       # off: the judge's best_moment_s timestamp lands after the
                              # play too often — needs frame-accurate detection (future)
  replay_min_score: 7         # clips ranked this high get a slow-mo best-moment replay
  replay_seconds: 6           # source seconds around the best moment (plays at 0.5x)
  outro_enabled: true
  outro_music: true             # outro = KEMONO logo over an NCS track's drop (even in lean mode)
  outro_seconds: 12             # length of the music outro
  outro_music_start: 0.33       # fallback drop position (frac of track) if energy detection fails
  min_clips: 3                # refuse to assemble OR publish a video with fewer clips
                              # than this. Every stage handles "zero items" gracefully,
                              # which is how a thin day still ships - but nothing used to
                              # ask whether a video actually existed before publishing
                              # one. On 2026-08-13 yt-dlp's Twitch extractor broke and
                              # all 181 downloads failed; the run assembled a 15-second
                              # intro-plus-outro with no clips and no credits, published
                              # it PUBLICLY, and exited 0. A broken extractor is an
                              # external event that WILL recur, so this makes it loud.
                              # 0 disables the check.
  # Target length. Reaching this is a question of how many candidates the judge is
  # given, not of a floor: see vlm_filter.max_keep, which is what actually sets it.
  # There is deliberately NO minimum-length setting. `target_minutes_min` used to sit
  # here and was never read by any code; wiring it up would have aborted real days that
  # shipped 3-5 min of genuinely good clips, which is worse than a short video. The
  # failure it looked like it guarded against — a broken extractor yielding nothing — is
  # covered properly by video.min_clips.
  target_minutes_ideal: 8     # fill toward this from already-judged clips (no extra fetching)
  target_minutes_max: 10      # trim the weakest clips back down to this
  music_enabled: false         # LEAN MODE: no background music (Synapse-style — the clip's own
                               # crowd/streamer audio carries it). true = loop a music_track bed.
  music_path: ""               # overridden by random pick from music_tracks; set directly to
                               # bypass the list (e.g. assets/music/bg.mp3 for the generated bed)
  music_tracks:                # one track is randomly selected per run
    - path: assets/music/ncs-why-we-lose.mp3
      artist: "Cartoon"
      title: "Why We Lose (feat. Coleman Trapp)"
    - path: assets/music/ncs-fearless-ii.mp3
      artist: "Lost Sky"
      title: "Fearless pt. II (feat. Chris Linton)"
    - path: assets/music/ncs-on-and-on.mp3
      artist: "Cartoon"
      title: "On & On (feat. Daniel Levi)"
    - path: assets/music/ncs-blank.mp3
      artist: "Disfigure"
      title: "Blank"
    - path: assets/music/ncs-invincible.mp3
      artist: "DEAF KEV"
      title: "Invincible"
    - path: assets/music/ncs-superhero.mp3
      artist: "Unknown Brain"
      title: "Superhero (feat. Chris Linton)"
  music_volume_db: -20        # baseline music level; auto-ducked during clip audio by sidechain
                              # (-20: lowered from -14 after viewer feedback "music too loud")
  music_duck_threshold: 0.02  # linear amplitude (~-34 dB) — triggers duck when clip audio is active
  music_duck_ratio: 4         # 4:1 compression ratio while sidechain is active
  music_duck_attack_ms: 50    # ms to duck (fast enough to catch speech onset)
  music_duck_release_ms: 400  # ms to release (slow enough to sound smooth)
  music_attribution: ""       # auto-set by config.py from selected track (e.g. "Cartoon - Why We Lose | NCS")
  voiceover_duck_db: -10      # how much clip audio ducks under voiceover
  nameplate:                  # animated PROJECT-style streamer intro (bottom-left)
    enabled: true             # false = use the plain drawtext lower-third instead
    hold_seconds: 5.0         # seconds fully visible before it fades out
    y_frac: 0.33              # vertical centre as a fraction of height (0.33 = a third down)
    accent: cyan              # cyan | orange | red | white
    eyebrow: LIVE             # small label shown above the name
    sfx_enabled: true         # subtle synthesized notification on flush-in
    sfx_path: assets/sfx/nameplate.wav   # auto-generated if missing (tools/gen_sfx)
    sfx_gain_db: -12          # how loud the SFX sits under the clip audio
    sfx_delay_ms: 120         # SFX onset after the clip starts

upload:
  riot_fan_notice: true       # append Riot's required fan-content notice to every video
                              # description. Their "Legal Jibber Jabber" policy permits
                              # both the use of their assets (champion splash art via Data
                              # Dragon, used by the brand intro and thumbnails) and ad
                              # revenue on the videos, but ONLY with a conspicuous notice
                              # in their exact wording. Turn this off only if you have
                              # removed every Riot asset from the pipeline.
  # SAFE BY DEFAULT: a fresh clone renders videos but never publishes them.
  # Turn this on deliberately, and move privacy off `private` only once you have
  # watched a few finished videos and are happy to put them on your channel.
  enabled: false              # true = upload to YouTube (first run opens a browser for OAuth)
  allow_reupload: false       # idempotency: skip if this date already uploaded (the bat retries
                              # on crash; without this a retry made a DUPLICATE video). true = force.
  privacy: private            # exactly one of: private | unlisted | public
  category_id: "20"           # Gaming
  # clickbait/curiosity titles; an episode series-marker is appended → "HOOK | 12"
  # (like daily-clip channels that number their uploads). Placeholders: {hook} {emoji}
  # {n} {star}. One is picked per day (rotated); credits.py has built-in defaults if omitted.
  # Episode numbers start at 1 and are assigned once per date_label in data/state.json
  # ("episodes" map) — stable across reruns/retries of the same date.
  title_date: true            # append " | <n>" as the daily-series marker
  title_styles:
    - "{hook}?! {emoji} League of Legends Best Moments"
    - "He Really Did THAT… {emoji} LoL Plays of the Day"
    - "Wait Until You See Clip #1 {emoji} LoL Best Moments"
    - "You Won't Believe These LoL Plays {emoji} (Top {n})"
    - "How Is This Even Possible?! {emoji} LoL Daily Top {n}"
    - "{hook} {emoji} The Best League of Legends Moments Today"
    - "{star} Went CRAZY… {emoji} LoL Best Moments (Top {n})"

thumbnail:                    # image model lives in llm.roles.thumbnail_image
  enabled: true               # generate a cinematic 1280×720 thumbnail per video
  provider: local             # local (free PIL, no key needed) | gemini (AI reaction, ~$0.04/img)
                              # Default is `local` so a fresh clone costs nothing and cannot
                              # fail on billing. Switch to `gemini` once you've enabled
                              # pay-as-you-go — image models are not on the free tier.
  face_search_top: 6          # scan this many top-ranked clips for a usable facecam (the "face we recognize")
  variants: 3                 # local-provider CTR variants (thumbnail.jpg = primary; rest for A/B)
  background_blur: 2          # px blur on the gameplay-frame background. A raw frame carries
                              # the HUD, minimap, health bars and often the streamer's chat
                              # overlay; at the ~320px the browse feed really renders, that
                              # detail competes with the headline. Blur (not darkening — the
                              # darker grade was rejected for crushing the edges) keeps it
                              # readable as this fight without fighting the text. 0 = off.
  face_samples: 9             # frames sampled around the peak to find the streamer's most
                              # EXPRESSIVE facecam moment. Was a single frame at the peak,
                              # which routinely landed on a flat or averted face — the face
                              # is the biggest element on the canvas, so it decides the CTR.
  # gemini: enhance the facecam into an over-the-top excited reaction on a green screen,
  # chroma-key it out, composite over the REAL clip gameplay (slight blur), then overlay a
  # centred metallic gold announcement (PENTAKILL/QUADRA in Montserrat Bold, assets/fonts),
  # a highlighted streamer badge, and a radiating red border.
  # Falls back to local (PIL face-forward design) when no key / no facecam / API error.
  # local: champion splash + reaction face + big hook phrase. Splash/pfp cached in data/cache/.
  # YouTube requires channel phone verification for custom thumbnail uploads.

shorts:
  enabled: true
  count: 3                    # how many shorts to render per day (top clips by rank score)
  upload: false               # SAFE BY DEFAULT (see upload.enabled). true = auto-upload after
                              # render; shares the main upload OAuth token.
  privacy: private            # private | unlisted | public
  detect_facecam: true        # detect webcam overlay in corners; split-screen layout if found
  target_seconds: 32          # punchy length — 20-35s wins on Shorts (retention drops past ~45s)
  pre_roll_s: 7               # seconds of build-up before the best moment (lead with the heat)
  caption_margin_v: 430       # blur-bg layout: px captions sit above the bottom (lower-third)
  caption_split_gap: 190      # split layout: px captions sit above the facecam, clearing the in-game
                              # HUD too (lower third of the gameplay panel)

cleanup:
  enabled: true
  keep_raw_days: 1            # keep raw MP4s for this many days back (for feedback reprocessing)
  keep_output_days: 0         # keep the finished data/output/<date>.mp4 for this many days,
                              # then delete it. 0 = keep forever (the default: on a clone
                              # with uploading disabled the master is the ONLY copy, and
                              # nothing should delete your work uninvited).
                              # A master is only ever removed when state.json holds a
                              # confirmed YouTube id for that date — i.e. a copy provably
                              # exists off this machine — so a failed or disabled upload
                              # keeps its video regardless of age. <date>.meta.json is
                              # never pruned: it is the record of who was credited.
                              # At ~550-850 MB per video this is ~200 GB/year if left off.

permissions:
  require_permission: false   # when true, only broadcasters approved in state.json are used

resources:                    # keep a run from making the machine unusable
  cpu_percent: 100            # cap CPU-bound work (ffmpeg threads, numpy/BLAS, opencv)
                              # at this share of your cores. 100 = no limit.
                              # Does NOT throttle the GPU: Ollama and NVENC run in their
                              # own processes and can't be capped portably from here.
  low_priority: false         # true = run at below-normal scheduling priority. ffmpeg
                              # children inherit it, so the whole run yields to whatever
                              # you're doing in the foreground. Costs wall-clock time.

paths:
  data: data                  # relative to repo root
