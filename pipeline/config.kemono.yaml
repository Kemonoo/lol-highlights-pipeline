# Example overlay — the settings the KEMONO channel actually runs with.
#
#   python -m pipeline.run_daily --config config.kemono.yaml
#   python -m pipeline.doctor    --config config.kemono.yaml
#
# An overlay holds ONLY the keys that differ from config.yaml; everything else is
# inherited. That is the intended way to keep your own settings — copy this file,
# change what you need, and upstream changes to config.yaml keep applying to you
# instead of becoming merge conflicts.
#
# Overlays compose, so throttling is a separate file rather than a variant of this one:
#
#   python -m pipeline.run_daily --config config.kemono.yaml
#   python -m pipeline.run_daily --config config.kemono.yaml,config.local.throttled.yaml
#
# ⚠ THIS OVERLAY PUBLISHES. It uploads to the maintainer's own channel, publicly.
# config.yaml stays upload-disabled and private so a fresh clone can never publish by
# accident; turning it on is a deliberate act, which is what passing --config is.
# If you cloned this repo: copy this file, don't use it — it is somebody else's channel.

twitch:
  eligible_only: true            # 222 = eligible clips (see prefilter), paging up to 1000 raw
  fetch_count: 222               # owner's pick: "222 clips in, 22 out". Twitch can return a
  max_fetch: 222                 # clip or two fewer than asked (219 of 220 on 2026-09-21);
                                 # max_fetch = fetch_count keeps expansion off, as upstream.

video:
  fps: 60                        # owner 2026-10-19: Twitch clips are 1080p60; 30 halved it
  upload_height: 1440            # YouTube encodes 1440p uploads far better than 1080p
  target_clips: 0                # owner 2026-10-12: quality first, aim for ~8 min - the
  target_minutes_ideal: 8        # duration rule fills toward 8 min with fillers that pass
  target_minutes_max: 11         # the raised bar, and publishes shorter rather than pad
                                 # (was a fixed 22: 21% of 10-06..10-11 clips were fillers,
                                 # incl. two World of Warcraft clips)
  fame:
    enabled: true                # owner 2026-10-23: famous names lead (Baus); unknown = "This Streamer"
  trim:
    enabled: true                # owner 2026-10-18: cut to the judge's action window
  clip_loudnorm: true            # owner 10-09: loudness jumps between streamers
  max_per_streamer: 0            # owner 2026-10-12: no cap - Baus has many good clips. The
                                 # 10-07 problem was the SAME moment several times, which
                                 # prefilter.dedupe_moments now prevents.
  caption_censor: stars          # owner 2026-10-23: curse words -> **** in captions
  caption_mask_words: [nigger, nigga, faggot, fag, retard, retarded, aids, cancer, kys]
  intro_enabled: false           # owner 2026-09-25: no brand sting, open straight on clip #22
  transitions:
    enabled: true                # owner 2026-09-25 picked whip, pixelate, subtle glitch
  brand:
    name: KEMONO
    tagline: DAILY LEAGUE OF LEGENDS
    splash_champion: LeeSin
    splash_skin: 11              # God Fist Lee Sin
  music_enabled: false           # lean mode: the clips' own audio carries the video
  outro_music: true              # ...but the outro still lands on an NCS drop
  nameplate:
    accent: cyan
  countdown:                       # owner's pick. Impact is a Windows system font, so it
    font: C:/Windows/Fonts/impact.ttf   # stays in this overlay rather than config.yaml,
    size: 132                      # which has to keep working on a fresh clone anywhere
                                   # (countdown.py falls back to Arial Black / Impact /
                                   # DejaVu if a configured face is missing).
    y_frac: 0.105                  # centre y=113. Sits in the HUD gap: the score+FPS rows
                                   # end ~y=55 and the blue-bordered killfeed portraits
                                   # start ~y=240. 0.14 left it almost touching the
                                   # killfeed; 0.09 crowds the FPS row. Impact is a static
                                   # font, so font_weight does nothing for it.

# Curated out after labelling: JP event / custom-tournament channels whose clips are
# talk-context rather than highlights. Yours will differ — this list is a finding
# about one channel's audience, not a recommendation.
blacklist:
  broadcasters:
    - kokujintv
    - k4sen
    - らいじん
    - revol87
    - デイワン

upload:
  enabled: true
  privacy: public                # goes live on the channel as soon as it finishes
  allow_reupload: false          # idempotency: a crash-retry must not double-post
  title_names: true             # owner 2026-10-21: search traffic is streamer names
  title_series: ""              # owner 2026-10-23: "<hook> #60", the series name ate the title
  title_mode: hook               # owner pick 2026-09-25: "<Gemini hook>... LoL Daily Clips #N"

shorts:
  upload: true
  title_names: true              # owner 2026-10-21
  name_tag: true                 # owner 2026-10-23: the Short never says who it is otherwise
  hook_text:
    enabled: true                # owner 2026-10-21: A/B test, half the Shorts get it
  upload_height: 2560           # owner 2026-10-19: 1440x2560 upload copy, like the long-form
  privacy: public
  speaker_colors: true           # owner 2026-09-25: colour-code captions by speaker
  facecam_avatar_motion: [15, 40]   # owner: 2D avatars / VTubers count as the streamer
  facecam_pad: 0.15              # owner: room around a person the edges didn't bound
  facecam_method: vlm            # owner pick 2026-09-25: the local vision model finds the
                                 # webcam/avatar; checked on 104 clips (DEVLOG)
  center_zoom: 1.3               # owner pick: no-webcam Shorts zoom in slightly on the centre
                                 # (1.45 cut too much of the fight; 1.0 = whole frame)

ranking_shorts:
  enabled: true                  # owner 2026-09-25: one of the 3 daily Shorts becomes a
                                 # TOP 5 ranking (pentakills, outplays, champion plays...)

weekly:
  enabled: true                  # 2026-10-18: Sunday "Best League Plays of the Week #N"
  upload: false                  # render only until the owner has watched the first one
  theme_max_clips: 18            # owner 2026-10-18: themed weeklies ~8 min too - qualify on
  theme_fill_score: 6.0          # 8 clips >= 7, then fill with clips >= 6
  theme_target_minutes: 8
  target_minutes: 8
  max_minutes: 9.5

thumbnail:
  clip_frame_check: true          # owner 2026-10-18: never a TAB scoreboard / death screen
  provider: clip                 # owner pick 2026-09-25: style A (best-moment gameplay +
                                   # webcam picture-in-picture + 1-3 words, red border). Free.
                                   # gemini would need a BILLED key (free image quota is 0,
                                   # verified 2026-08-23); local = the old splash+avatar design.
  clip_rotation:
    layout_by_emotion: true        # owner 2026-10-24: big face only when it is reacting
    enabled: true                  # owner 2026-10-07: alternate pip / big face, cycle 5 palettes

cleanup:
  keep_output_days: 2             # owner 2026-10-21: keep metadata, not videos. YouTube holds
                                  # the canonical copy; 2 days is enough to catch a bad render.
                                  # Masters are ~2.5-3 GB each since 60 fps / 1440p.
                                  # (tools/stream.py streams these, so it gets fewer to loop.)
  cache_max_age_days: 14          # nameplate cache was 4 GB: one animation per streamer ever seen

prefilter:                       # owner 2026-10-12, after two outside reviews + his notes
  # ja/zh excluded again (owner, same day, after 93 reviews: 3 of 26 ja/zh clips good or
  # ok vs 39 of 97 others; in the no-ban replay they took 41 of 60 judge slots for 2 real
  # outplays). The pool no longer shrinks: twitch.eligible_only fetches until 222 of the
  # clips are eligible. Proven ja/zh streamers go on the allow-list.
  include_languages: []
  exclude_languages: [ja, zh]
  language_allow_streamers: [神楽めあ]   # owner rated her Annie outplay good (10-11)
  dedupe_moments: true
  moment_prefer: short           # owner 2026-10-18: of comparable clips, the shorter one
  max_keep: 120                  # 2026-10-18: wider pool for the Claude pre-screen to choose
                                 # the judge's 50 from (was 80 -> ~60 gameplay; the VLM check
                                 # is ~16 s/clip, so +11 min a night)
  rank: signals
  quiet_gate: false
  audio_weight: 0                # owner: loudness says nothing (a silent KatEvolved outplay
                                 # on 10-10 was "perfect")
  boost_streamers:               # owner 2026-10-12: "most of his clips are very good" -
    thebausffs: 0.3              # his 'Supp vs Top' (10-06) was the day's best and ranked out

prescreen:
  enabled: true                  # owner 2026-10-18: Claude (subscription, `claude -p`)
                                 # orders the judge's queue by content, not views

api_judge:
  hard_facts: true
  filler_min_entertainment: 5
  filler_min_play: 4
  filler_focus: [gameplay]
  outplay_only_languages: [ja, zh]   # owner: Asian-language clips only with a real outplay

vlm_filter:
  mode: sanity                   # local 4B model: "is this League gameplay" only
  kill_scan: false               # ...and nothing else, so 80 candidates fit the night
  max_keep: 50                   # clips the judge watches. 50, not 60: 10 calls of headroom
                                 # for failed requests and crash-retries (owner). 2026-10-12: with mode: sanity the
                                 # cheap stages no longer filter, so whatever ranks into this
                                 # cap IS the choice (10-11's replay lost Burrito ent 8 and
                                 # slimeIRL ent 7 below a cap of 35). 60 = 3 full Flash models'
                                 # free allowance (3.6, 3.8, 3-preview at 20/day each).

llm:
  roles:
    # owner 2026-10-21: text jobs go to Claude on the subscription (`claude -p`), Gemini only
    # where Claude can't (the judge watches video WITH SOUND; speakers listen to audio).
    # Gemini stays as the fallback when Claude is out of usage or logged out.
    commentary:                  # titles, thumbnail words, Shorts titles + hook text
      provider: claude_code
      model: sonnet
      timeout_s: 180
      overflow_models: []        # the base list holds Gemini ids
      fallback:
        provider: gemini
        model: gemini-3.1-flash-lite
        api_key: ${GEMINI_API_KEY}
    feedback:                    # viewer-comment classification
      provider: claude_code
      model: sonnet
      timeout_s: 180
