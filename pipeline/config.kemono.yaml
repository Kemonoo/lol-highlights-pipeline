# Example overlay — the settings the KEMONO channel actually runs with.
#
#   python -m pipeline.run_daily --config config.kemono.yaml
#   python -m pipeline.doctor    --config config.kemono.yaml
#
# An overlay holds ONLY the keys that differ from config.yaml; everything else is
# inherited. That is the intended way to keep your own settings — copy this file,
# change what you need, and upstream changes to config.yaml keep applying to you
# instead of becoming merge conflicts.
#
# Overlays compose, so throttling is a separate file rather than a variant of this one:
#
#   python -m pipeline.run_daily --config config.kemono.yaml
#   python -m pipeline.run_daily --config config.kemono.yaml,config.local.throttled.yaml
#
# ⚠ THIS OVERLAY PUBLISHES. It uploads to the maintainer's own channel, publicly.
# config.yaml stays upload-disabled and private so a fresh clone can never publish by
# accident; turning it on is a deliberate act, which is what passing --config is.
# If you cloned this repo: copy this file, don't use it — it is somebody else's channel.

twitch:
  fetch_count: 222               # owner's pick: "222 clips in, 22 out". Twitch can return a
  max_fetch: 222                 # clip or two fewer than asked (219 of 220 on 2026-09-21);
                                 # max_fetch = fetch_count keeps expansion off, as upstream.

video:
  target_clips: 22               # owner's pick: a top-22 countdown (was 20; 17ish from the 8-min rule)
  brand:
    name: KEMONO
    tagline: DAILY LEAGUE OF LEGENDS
    splash_champion: LeeSin
    splash_skin: 11              # God Fist Lee Sin
  music_enabled: false           # lean mode: the clips' own audio carries the video
  outro_music: true              # ...but the outro still lands on an NCS drop
  nameplate:
    accent: cyan
  countdown:                       # owner's pick. Impact is a Windows system font, so it
    font: C:/Windows/Fonts/impact.ttf   # stays in this overlay rather than config.yaml,
    size: 132                      # which has to keep working on a fresh clone anywhere
                                   # (countdown.py falls back to Arial Black / Impact /
                                   # DejaVu if a configured face is missing).
    y_frac: 0.105                  # centre y=113. Sits in the HUD gap: the score+FPS rows
                                   # end ~y=55 and the blue-bordered killfeed portraits
                                   # start ~y=240. 0.14 left it almost touching the
                                   # killfeed; 0.09 crowds the FPS row. Impact is a static
                                   # font, so font_weight does nothing for it.

# Curated out after labelling: JP event / custom-tournament channels whose clips are
# talk-context rather than highlights. Yours will differ — this list is a finding
# about one channel's audience, not a recommendation.
blacklist:
  broadcasters:
    - kokujintv
    - k4sen
    - らいじん
    - revol87
    - デイワン

upload:
  enabled: true
  privacy: public                # goes live on the channel as soon as it finishes
  allow_reupload: false          # idempotency: a crash-retry must not double-post
  title_mode: hook               # owner pick 2026-09-25: "<Gemini hook>... LoL Daily Clips #N"

shorts:
  upload: true
  privacy: public
  facecam_avatar_motion: [15, 40]   # owner: 2D avatars / VTubers count as the streamer
  facecam_pad: 0.15              # owner: room around a person the edges didn't bound
  facecam_method: vlm            # owner pick 2026-09-25: the local vision model finds the
                                 # webcam/avatar; checked on 104 clips (DEVLOG)
  center_zoom: 1.3               # owner pick: no-webcam Shorts zoom in slightly on the centre
                                 # (1.45 cut too much of the fight; 1.0 = whole frame)

ranking_shorts:
  enabled: true                  # owner 2026-09-25: one of the 3 daily Shorts becomes a
                                 # TOP 5 ranking (pentakills, outplays, champion plays...)

thumbnail:
  provider: clip                  # owner pick 2026-09-25: style A (best-moment gameplay +
                                   # webcam picture-in-picture + 1-3 words, red border). Free.
                                   # gemini would need a BILLED key (free image quota is 0,
                                   # verified 2026-08-23); local = the old splash+avatar design.

cleanup:
  keep_output_days: 7             # this channel uploads publicly, so YouTube holds the
                                  # canonical copy; a week is enough to catch a bad render
                                  # and re-cut it. Masters are ~550-850 MB each, i.e. about
                                  # 200 GB/year of local disk if never pruned.

vlm_filter:
  max_keep: 35                   # a 22-clip countdown needs ~33 judged candidates (32 was
                                 # sized for 20); the VLM usually keeps more than 24 anyway
                                 # (the cap cut ~9/day). >20 judge calls walks the model chain.
